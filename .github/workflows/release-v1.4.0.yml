name: Build and release Dicode Config Checker v1.5.1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dicode-v1-5-1-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.5.1
  ANDROID_LIB_COMMIT: ecf84ee82ac975c39852397351d1618a40df7cd2
  VAZIRMATN_COMMIT: 6e553e33489a8f9dfaccc76860a2e3f3c1e66de7
  VAZIRMATN_BLOB: 64e4a8189557a17b63fd7a77794207483e592972

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: python -m py_compile engine.py app.py desktop.py runtime_paths.py subscription_publisher.py scripts/patch_android_*.py
      - name: Run regression tests
        run: |
          python -m pip install --upgrade pip pytest
          PYTHONPATH=. pytest -q tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Add verified Vazirmatn font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/fonts | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/rastikerdar/vazirmatn/${{ env.VAZIRMATN_COMMIT }}/fonts/ttf/Vazirmatn-Regular.ttf" -OutFile assets/fonts/Vazirmatn-Regular.ttf
          if ((git hash-object assets/fonts/Vazirmatn-Regular.ttf).Trim() -ne "${{ env.VAZIRMATN_BLOB }}") { throw "Vazirmatn integrity check failed" }
      - name: Build Windows portable executable
        shell: pwsh
        run: |
          ./scripts/build_v140_windows.ps1
          Move-Item dist/DicodeConfigChecker.exe DicodeConfigChecker-v${{ env.VERSION }}-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: DicodeConfigChecker-v${{ env.VERSION }}-windows-x64.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime libraries and build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Add verified Vazirmatn font
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/${VAZIRMATN_COMMIT}/fonts/ttf/Vazirmatn-Regular.ttf" -o assets/fonts/Vazirmatn-Regular.ttf
          test "$(git hash-object assets/fonts/Vazirmatn-Regular.ttf)" = "$VAZIRMATN_BLOB"
      - name: Build Linux portable archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python engine.py --download-xray-only
          test -x core/xray
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DicodeConfigChecker --add-data assets:assets --add-data channels.txt:. --add-binary core/xray:core --add-data core/geoip.dat:core --add-data core/geosite.dat:core desktop.py
          mkdir DicodeConfigChecker-v${VERSION}-linux-x86_64
          cp dist/DicodeConfigChecker README.md LICENSE DicodeConfigChecker-v${VERSION}-linux-x86_64/
          tar -czf DicodeConfigChecker-v${VERSION}-linux-x86_64.tar.gz DicodeConfigChecker-v${VERSION}-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: DicodeConfigChecker-v${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Add verified Vazirmatn font
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/${VAZIRMATN_COMMIT}/fonts/ttf/Vazirmatn-Regular.ttf" -o assets/fonts/Vazirmatn-Regular.ttf
          test "$(git hash-object assets/fonts/Vazirmatn-Regular.ttf)" = "$VAZIRMATN_BLOB"
      - name: Build macOS application
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python engine.py --download-xray-only
          test -x core/xray
          python -m PyInstaller --noconfirm --clean --windowed --name DicodeConfigChecker --add-data assets:assets --add-data channels.txt:. --add-binary core/xray:core --add-data core/geoip.dat:core --add-data core/geosite.dat:core desktop.py
          codesign --force --deep --sign - dist/DicodeConfigChecker.app
          ditto -c -k --sequesterRsrc --keepParent dist/DicodeConfigChecker.app "DicodeConfigChecker-v${VERSION}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: DicodeConfigChecker-v${{ env.VERSION }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build Android Xray library
        run: |
          git clone https://github.com/2dust/AndroidLibXrayLite.git /tmp/AndroidLibXrayLite
          cd /tmp/AndroidLibXrayLite
          git checkout "$ANDROID_LIB_COMMIT"
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p assets data
          bash gen_assets.sh download
          cp data/*.dat assets/
          gomobile init
          go mod tidy
          gomobile bind -v -androidapi 26 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp libv2ray.aar "$GITHUB_WORKSPACE/android/app/libs/libv2ray.aar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply Android updates and build APK
        run: |
          python scripts/patch_android_ui.py
          python scripts/patch_android_v120.py
          python scripts/patch_android_v120_imports.py
          python scripts/patch_android_v130.py
          python scripts/patch_android_v140.py
          python scripts/patch_android_v141.py
          python scripts/patch_android_v149.py
          python scripts/patch_android_v150.py
          python scripts/patch_android_v150_fix.py
          python scripts/patch_android_v150_copy.py
          python scripts/patch_android_v150_manual_subscription.py
          mkdir -p android/app/src/main/res/font
          curl -fsSL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/${VAZIRMATN_COMMIT}/fonts/ttf/Vazirmatn-Regular.ttf" -o android/app/src/main/res/font/vazirmatn_regular.ttf
          test "$(git hash-object android/app/src/main/res/font/vazirmatn_regular.ttf)" = "$VAZIRMATN_BLOB"
          python scripts/patch_android_v151.py
          gradle -p android :app:assembleDebug --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk DicodeConfigChecker-v${VERSION}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: DicodeConfigChecker-v${{ env.VERSION }}-android.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare source archive and checksums
        run: |
          git archive --format=zip --output release/DicodeConfigChecker-v${VERSION}-source.zip HEAD
          cd release
          sha256sum DicodeConfigChecker-* > SHA256SUMS.txt
      - name: Publish stable v1.5.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v${VERSION} --cleanup-tag --yes 2>/dev/null || true
          gh release create v${VERSION} release/* --title "Dicode Config Checker v${VERSION}" --notes-file RELEASE_NOTES_1.5.1.md --latest --target "$GITHUB_SHA"
